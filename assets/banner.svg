<svg width="100%" height="280" viewBox="0 0 960 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="0" r="1.5" fill="#64748b" fill-opacity="0.4" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .orb-pulse {
      animation: pulse 8s ease-in-out infinite alternate;
    }
    .flow-line {
      stroke-dasharray: 8 8;
      animation: dash 15s linear infinite;
    }
    .node-float-1 {
      animation: float 6s ease-in-out infinite alternate;
    }
    .node-float-2 {
      animation: float 7s ease-in-out 1.5s infinite alternate;
    }
    .node-float-3 {
      animation: float 8s ease-in-out 3s infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(1) translate(0px, 0px); opacity: 0.25; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.45; }
      100% { transform: scale(0.95) translate(-15px, 20px); opacity: 0.3; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -160; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
      font-weight: 600;
      font-size: 11px;
    }
  </style>

  <!-- Base Card Background -->
  <rect width="960" height="280" rx="16" fill="url(#bgGrad)" />
  <rect width="960" height="280" rx="16" fill="url(#grid)" />

  <!-- Dynamic / Animated Ambient Glowing Orbs in Background -->
  <g filter="url(#glow)">
    <circle class="orb-pulse" cx="160" cy="70" r="90" fill="#6366f1" opacity="0.35" />
    <circle class="orb-pulse" cx="800" cy="200" r="110" fill="#a855f7" opacity="0.3" />
    <circle class="orb-pulse" cx="500" cy="140" r="75" fill="#06b6d4" opacity="0.2" />
  </g>

  <!-- Dynamic Animated Schema Transformation Flow Lines (Behind text) -->
  <g opacity="0.4" class="flow-line">
    <path d="M 80 220 Q 240 180 480 220 T 880 200" stroke="#38bdf8" stroke-width="2" fill="none" />
    <path d="M 120 70 Q 360 40 600 80 T 920 60" stroke="#c084fc" stroke-width="1.5" fill="none" />
  </g>

  <!-- Interactive schema conversion pill nodes floating dynamically in background -->
  <g class="node-float-1" opacity="0.65">
    <rect x="70" y="35" width="110" height="28" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" />
    <text x="125" y="53" text-anchor="middle" fill="#93c5fd" class="badge-text">OpenAPI 3.1</text>
  </g>

  <g class="node-float-2" opacity="0.65">
    <rect x="760" y="40" width="130" height="28" rx="14" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2" />
    <text x="825" y="58" text-anchor="middle" fill="#c4b5fd" class="badge-text">Postman &amp; RAML</text>
  </g>

  <g class="node-float-3" opacity="0.65">
    <rect x="720" y="215" width="165" height="28" rx="14" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" />
    <text x="802" y="233" text-anchor="middle" fill="#f472b6" class="badge-text">SDK &amp; Client Codegen</text>
  </g>

  <g class="node-float-2" opacity="0.65">
    <rect x="90" y="215" width="130" height="28" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
    <text x="155" y="233" text-anchor="middle" fill="#6ee7b7" class="badge-text">JSON Schema &amp; TS</text>
  </g>

  <!-- FOREGROUND: Clean, Sharp, Unobscured Header and Titles -->
  <g id="foreground-content">
    <!-- Icon / Logo Element -->
    <g transform="translate(480, 52)">
      <circle cx="0" cy="0" r="28" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="2.5" />
      <path d="M -12 -5 L -2 -14 L 8 -5 M -8 5 L 2 14 L 12 5" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="-2" cy="0" r="3" fill="#a855f7" />
      <circle cx="2" cy="0" r="3" fill="#38bdf8" />
    </g>

    <!-- Main Title -->
    <text x="480" y="125" text-anchor="middle" fill="url(#primaryTextGrad)" class="title-text" font-size="34">
      Awesome API Schema Importer &amp; Converter
    </text>

    <!-- Subtitle / Tagline -->
    <text x="480" y="158" text-anchor="middle" fill="#e2e8f0" class="sub-text" font-size="16">
      The Ultimate Directory of API Converters, Parsers, Validators, Bundlers &amp; SDK Generators
    </text>

    <!-- Supported Tech Specs Row -->
    <text x="480" y="185" text-anchor="middle" fill="#94a3b8" class="badge-text" font-size="12">
      OpenAPI • Swagger • JSON Schema • GraphQL • AsyncAPI • Protobuf • RAML • Postman • TypeScript
    </text>
  </g>

  <!-- Border Highlight -->
  <rect x="0.5" y="0.5" width="959" height="279" rx="15.5" stroke="#475569" stroke-width="1" stroke-opacity="0.4" fill="none" />
</svg>